<app-header />

<main>
    <div id="users">
        @for (u of users; track u.id;) {
            <app-user [selected]="u.id === selectdeUserId" [user]="u" (selectedUser)="onSelectedUser($event)" />
        }
    </div>

    @if(selectedUser){
        <div>
            <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name"></app-tasks>
        </div>
    } @else {
        <div id="fallback">
            <p>Select user to show tasks.</p>
        </div>
    }
    
    
</main>
