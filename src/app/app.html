<app-header />

<main>
    <div id="users">
        @for (u of users; track u.id;) {
            <app-user [user]="u" (selectedUser)="onSelectedUser($event)" />
        }
    </div>

    @if(selectedUser){
        <div>
            <app-task [name]="selectedUser.name"></app-task>
        </div>
    } @else {
        <div>
            <p>Select user to show tasks.</p>
        </div>
    }
    
    
</main>
